<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business Portal</title>
  <!-- Google Fonts for Bold Geometric, Classic Serif & Cursive Script -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Cinzel:wght@500;600;700&family=Great+Vibes&family=Libre+Baskerville:wght@400;700&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-black: #000000;
      --pure-white: #ffffff;
      --epic-orange: #f57c00;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--pure-white);
    }

    /* Solid Jet-Black Mobile-First Container matching Reference Image */
    .app-container {
      position: relative;
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background-color: var(--bg-black);
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 34px 20px 30px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75);
    }

    .content-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      justify-content: space-between;
      gap: 20px;
    }

    /* EP!C MEN'S WEAR Bracketed Logo Header */
    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      text-decoration: none;
      width: 100%;
      margin-top: 4px;
    }

    .brand-logo-box {
      width: 100%;
      max-width: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 0;
    }

    .brand-logo-box img,
    .brand-logo-box svg {
      width: 100%;
      height: auto;
      max-height: 280px;
      object-fit: contain;
      display: block;
    }

    .brand-tagline {
      font-family: 'Times New Roman', 'Bodoni Moda', Georgia, serif;
      font-weight: 400;
      font-size: 18px;
      letter-spacing: 3.2px;
      color: var(--pure-white);
      margin-top: 8px;
      text-transform: lowercase;
    }

    /* 4-Column Clean Floating Icons Grid (No borders/boxes) */
    .grid-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px 10px;
      width: 100%;
      max-width: 390px;
      margin: 14px 0 8px;
      justify-items: center;
      align-items: start;
    }

    .nav-card {
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 4px 2px;
      transition: transform 0.18s ease, opacity 0.18s ease;
    }

    .nav-card:hover {
      transform: translateY(-3px);
    }

    .nav-card:active {
      transform: scale(0.93);
    }

    .icon-wrap {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }

    .nav-card:hover .icon-wrap {
      background: rgba(245, 124, 0, 0.14);
      box-shadow: 0 6px 18px rgba(245, 124, 0, 0.25);
    }

    .icon-wrap img,
    .icon-wrap svg {
      width: 56px;
      height: 56px;
      object-fit: contain;
    }

    .nav-label {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 12.2px;
      color: var(--pure-white);
      text-align: center;
      line-height: 1.25;
      letter-spacing: 0.2px;
    }

    /* Orange Cursive Thankyou, Swoosh & 5 Gold Stars */
    .thankyou-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin-top: auto;
      margin-bottom: 6px;
    }

    .thankyou-text {
      font-family: 'Great Vibes', cursive;
      font-size: 82px;
      line-height: 0.92;
      color: var(--epic-orange);
      padding: 0 10px;
      user-select: none;
    }

    .orange-arc-swoosh {
      width: 310px;
      height: 22px;
      margin-top: -2px;
      margin-bottom: 6px;
    }

    .stars-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
    }

    .gold-taper-line {
      width: 58px;
      height: 4px;
    }

    .stars-row {
      display: flex;
      gap: 6px;
      cursor: pointer;
    }

    .star-icon {
      width: 31px;
      height: 31px;
      transition: transform 0.2s ease;
    }

    .star-icon:hover {
      transform: scale(1.15);
    }

    .provided-by {
      font-family: 'Montserrat', sans-serif;
      font-size: 10.5px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.72);
      margin-top: 12px;
      letter-spacing: 0.4px;
    }
  </style>
</head>
<body>

  <!-- Main Black Business Portal Screen -->
  <div class="app-container" id="mainAppContainer">
    <div class="content-wrapper">
      
      <!-- Brand EP!C MEN'S WEAR Bracketed Logo & Tagline -->
      <a class="brand-header" id="brandHeaderLink" href="javascript:void(0)">
        <div class="brand-logo-box" id="logoContainer">
          <!-- Custom Bracketed EP!C MEN'S WEAR Logo with Pure White Text on Jet-Black Background -->
          <svg viewBox="0 0 420 405" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EP!C MEN'S WEAR a branded store">
            <rect width="420" height="405" fill="#000000"/>

            <!-- Top White Bracket -->
            <path d="M58 84 V18 H362 V84" stroke="#ffffff" stroke-width="11" stroke-linecap="square" stroke-linejoin="miter"/>

            <!-- Letter E (Pure White) -->
            <path d="M44 102 H129 V123 H70 V147 H121 V167 H70 V192 H131 V213 H44 V102 Z" fill="#ffffff"/>

            <!-- Letter P (Pure White) -->
            <path d="M148 102 H200 C223 102 237 116 237 138 C237 160 223 174 200 174 H174 V213 H148 V102 Z M174 122 V154 H197 C207 154 212 148 212 138 C212 128 207 122 197 122 H174 Z" fill="#ffffff"/>

            <!-- Exclamation Mark (!) with Pure White Bar & Orange Square Dot -->
            <rect x="251" y="102" width="25" height="74" fill="#ffffff"/>
            <rect x="251" y="188" width="25" height="25" fill="#f57c00"/>

            <!-- Letter C (Pure White) -->
            <path d="M379 135 C374 124 364 119 351 119 C332 119 319 134 319 157.5 C319 181 332 196 351 196 C364 196 374 191 379 180 L401 191 C391 209 374 218 350 218 C315 218 293 193 293 157.5 C293 122 315 97 350 97 C374 97 391 106 401 124 L379 135 Z" fill="#ffffff"/>

            <!-- MEN'S WEAR in Pure White (Increased Size & Elaborated Spacing matching Reference Serif Style) -->
            <text x="210" y="268" fill="#ffffff" font-family="'Times New Roman', 'Bodoni Moda', Times, Georgia, serif" font-size="35" font-weight="400" letter-spacing="13" textLength="354" lengthAdjust="spacing" text-anchor="middle">MEN'S WEAR</text>

            <!-- Bottom White Bracket -->
            <path d="M58 288 V332 H362 V288" stroke="#ffffff" stroke-width="11" stroke-linecap="square" stroke-linejoin="miter"/>

            <!-- "a branded store" in Pure White (Elaborated Size & Full-Width Spacing) -->
            <text x="210" y="388" fill="#ffffff" font-family="'Times New Roman', 'Bodoni Moda', Times, Georgia, serif" font-size="39" font-weight="400" letter-spacing="15" textLength="396" lengthAdjust="spacing" text-anchor="middle">a branded store</text>
          </svg>
        </div>
      </a>

      <!-- 4-in-a-Row Clean Social & Action Icons Grid -->
      <div class="grid-buttons" id="actionButtonsGrid"></div>

      <!-- Orange Thankyou, Curved Arc & 5 Gold Stars -->
      <div class="thankyou-section">
        <div class="thankyou-text" id="thankyouText">Thankyou</div>

        <!-- Curved Orange Arc Swoosh -->
        <svg class="orange-arc-swoosh" viewBox="0 0 320 22" fill="none">
          <path d="M12 20 C105 1, 215 1, 308 20 C215 6, 105 6, 12 20 Z" fill="#f57c00"/>
        </svg>

        <!-- 5 Gold Stars with Tapered Gold Side Lines -->
        <div class="stars-wrapper">
          <!-- Left Tapered Gold Line -->
          <svg class="gold-taper-line" viewBox="0 0 60 4" fill="none">
            <defs>
              <linearGradient id="leftLineGold" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#c99326" stop-opacity="0"/>
                <stop offset="100%" stop-color="#fbe082"/>
              </linearGradient>
            </defs>
            <polygon points="0,2 60,0.4 60,3.6" fill="url(#leftLineGold)"/>
          </svg>

          <!-- 5 Faceted Gold Stars -->
          <div class="stars-row" id="starsRow">
            <svg class="star-icon" viewBox="0 0 36 36">
              <defs>
                <linearGradient id="epicStarGold" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#fff3b8"/>
                  <stop offset="45%" stop-color="#f2be35"/>
                  <stop offset="100%" stop-color="#b87b14"/>
                </linearGradient>
              </defs>
              <path fill="url(#epicStarGold)" d="M18 2l4.8 9.7 10.7 1.6-7.7 7.5 1.8 10.7L18 26.4l-9.6 5.1 1.8-10.7-7.7-7.5 10.7-1.6z"/>
            </svg>
            <svg class="star-icon" viewBox="0 0 36 36"><path fill="url(#epicStarGold)" d="M18 2l4.8 9.7 10.7 1.6-7.7 7.5 1.8 10.7L18 26.4l-9.6 5.1 1.8-10.7-7.7-7.5 10.7-1.6z"/></svg>
            <svg class="star-icon" viewBox="0 0 36 36"><path fill="url(#epicStarGold)" d="M18 2l4.8 9.7 10.7 1.6-7.7 7.5 1.8 10.7L18 26.4l-9.6 5.1 1.8-10.7-7.7-7.5 10.7-1.6z"/></svg>
            <svg class="star-icon" viewBox="0 0 36 36"><path fill="url(#epicStarGold)" d="M18 2l4.8 9.7 10.7 1.6-7.7 7.5 1.8 10.7L18 26.4l-9.6 5.1 1.8-10.7-7.7-7.5 10.7-1.6z"/></svg>
            <svg class="star-icon" viewBox="0 0 36 36"><path fill="url(#epicStarGold)" d="M18 2l4.8 9.7 10.7 1.6-7.7 7.5 1.8 10.7L18 26.4l-9.6 5.1 1.8-10.7-7.7-7.5 10.7-1.6z"/></svg>
          </div>

          <!-- Right Tapered Gold Line -->
          <svg class="gold-taper-line" viewBox="0 0 60 4" fill="none">
            <defs>
              <linearGradient id="rightLineGold" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#fbe082"/>
                <stop offset="100%" stop-color="#c99326" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <polygon points="0,0.4 60,2 0,3.6" fill="url(#rightLineGold)"/>
          </svg>
        </div>

        <div class="provided-by" id="providedByText">Provided by Karthik</div>
      </div>

    </div>
  </div>

  <!-- ================= ALL-IN-ONE CONFIGURATION (ఇక్కడ మీ వివరాలు మార్చుకోండి) ================= -->
  <script>
    const PORTAL_CONFIG = {
      // 1. బ్రాండ్ ట్యాగ్‌లైన్
      BRAND_SUBTITLE: "a branded store",

      // 2. కస్టమ్ లోగో చిత్రం URL (ఖాళీగా ఉంచితే మీరు పంపిన EP!C MEN'S WEAR లోగో కనిపిస్తుంది; లేదా మీ ఇమేజ్ URL ఇవ్వవచ్చు)
      LOGO_URL: "",

      // 3. లోగో/పేరు మీద క్లిక్ చేస్తే ఎక్కడికి వెళ్ళాలో ఆ లింక్
      LOGO_CLICK_LINK: "https://yourwebsite.com",

      // 4. బటన్ల లిస్ట్ (ఏదైనా ఒక బ్లాక్ కాపీ చేసి క్రింద పేస్ట్ చేస్తే కొత్త ఐకాన్ యాడ్ అవుతుంది!)
      BUTTONS: [
        {
          label: "Google\nReviews",
          link: "https://g.page/r/YOUR_GOOGLE_REVIEW_LINK/review",
          iconUrl: "",
          iconType: "google",
          position: 1
        },
        {
          label: "Contact\nUs",
          link: "tel:+919876543210",
          iconUrl: "",
          iconType: "call",
          position: 2
        },
        {
          label: "Instagram",
          link: "https://instagram.com/your_username",
          iconUrl: "",
          iconType: "instagram",
          position: 3
        },
        {
          label: "WhatsApp",
          link: "https://wa.me/919876543210",
          iconUrl: "",
          iconType: "whatsapp",
          position: 4
        },
        {
          label: "Our\nLocation",
          link: "https://maps.google.com/?q=YOUR_STORE_LOCATION",
          iconUrl: "",
          iconType: "location",
          position: 5
        }
      ],

      // 5. క్రింద కనిపించే పేరు
      PROVIDED_BY: "Provided by Karthik"
    };

    // Built-in Crisp Vector Icons matching the Reference Image
    const BUILTIN_ICONS = {
      home: `
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#f57c00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5L12 3l9 7.5" />
          <path d="M5 9.5V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9.5" />
          <path d="M9 21V12h6v9" />
        </svg>`,
      google: `
        <svg width="54" height="54" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>`,
      call: `
        <svg width="50" height="50" viewBox="0 0 24 24" fill="#25D366">
          <path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 011 1V20a1 1 0 01-1 1C10.07 21 3 13.93 3 5a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.46.57 3.58a1 1 0 01-.25 1.01l-2.2 2.2z"/>
        </svg>`,
      instagram: `
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none">
          <defs>
            <linearGradient id="igEpicGrad" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#feda75"/>
              <stop offset="25%" stop-color="#fa7e1e"/>
              <stop offset="50%" stop-color="#d62976"/>
              <stop offset="75%" stop-color="#962fbf"/>
              <stop offset="100%" stop-color="#4f5bd5"/>
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="20" height="20" rx="5.5" fill="url(#igEpicGrad)"/>
          <rect x="5.5" y="5.5" width="13" height="13" rx="3.8" stroke="#ffffff" stroke-width="1.8"/>
          <circle cx="12" cy="12" r="3.2" stroke="#ffffff" stroke-width="1.8"/>
          <circle cx="16.2" cy="7.8" r="1.1" fill="#ffffff"/>
        </svg>`,
      whatsapp: `
        <svg width="56" height="56" viewBox="0 0 32 32" fill="none">
          <circle cx="16" cy="16" r="14.5" fill="#ffffff"/>
          <path fill="#25D366" d="M16 3.5C9.1 3.5 3.5 9.1 3.5 16c0 2.21.58 4.37 1.67 6.27L3.4 28.6l6.51-1.71A12.44 12.44 0 0016 28.5c6.9 0 12.5-5.6 12.5-12.5S22.9 3.5 16 3.5z"/>
          <path fill="#ffffff" d="M22.4 19.1c-.3-.2-1.8-.9-2.1-1-.3-.1-.5-.2-.7.2-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-.3-.2-1.2-.4-2.3-1.4-.8-.7-1.4-1.7-1.6-1.9-.2-.3 0-.4.1-.6.1-.1.3-.3.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5-.1-.2-.6-1.6-.8-2.1-.2-.6-.4-.5-.6-.5h-.6c-.2 0-.5.1-.7.4-.3.3-.9.9-.9 2.3s1 2.7 1.1 2.9c.2.2 2 3 4.8 4.2.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.8-.7 2.1-1.5.3-.7.3-1.3.2-1.5-.1-.1-.3-.2-.6-.4z"/>
        </svg>`,
      location: `
        <svg width="58" height="58" viewBox="0 0 48 48" fill="none">
          <polygon points="5,43 16,25 32,25 43,43 24,46" fill="#e8eaed"/>
          <polygon points="5,43 16,25 22,35 14,45" fill="#34A853"/>
          <polygon points="43,43 32,25 26,35 34,45" fill="#4285F4"/>
          <polygon points="14,45 22,35 26,35 34,45" fill="#FBBC05"/>
          <path d="M11 38 L37 31" stroke="#ffffff" stroke-width="2.5"/>
          <path d="M24 3C16.27 3 10 9.27 10 17c0 10.5 14 23.5 14 23.5S38 27.5 38 17c0-7.73-6.27-14-14-14z" fill="#EA4335"/>
          <path d="M24 3C16.27 3 10 9.27 10 17c0 3.4 1.25 6.9 3.2 10.2L24 17V3z" fill="#4285F4"/>
          <path d="M24 3v14l10.8 10.2C36.75 23.9 38 20.4 38 17c0-7.73-6.27-14-14-14z" fill="#34A853"/>
          <path d="M13.2 27.2C16.8 33.2 24 40.5 24 40.5s7.2-7.3 10.8-13.3L24 17l-10.8 10.2z" fill="#FBBC05"/>
          <circle cx="24" cy="17" r="5.5" fill="#000000"/>
        </svg>`,
      website: `
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#f57c00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>`
    };

    (function renderPortal() {
      // Set Brand Subtitle
      const subtitleEl = document.getElementById("brandSubtitleText");
      if (subtitleEl && PORTAL_CONFIG.BRAND_SUBTITLE) {
        subtitleEl.textContent = PORTAL_CONFIG.BRAND_SUBTITLE;
      }

      // Set Custom Logo if provided
      if (PORTAL_CONFIG.LOGO_URL && PORTAL_CONFIG.LOGO_URL.trim() !== "") {
        document.getElementById("logoContainer").innerHTML = `<img src="${PORTAL_CONFIG.LOGO_URL}" alt="Brand Logo">`;
      }

      // Set Brand Header Link
      const headerLink = document.getElementById("brandHeaderLink");
      if (headerLink && PORTAL_CONFIG.LOGO_CLICK_LINK && PORTAL_CONFIG.LOGO_CLICK_LINK.trim() !== "") {
        headerLink.href = PORTAL_CONFIG.LOGO_CLICK_LINK;
        headerLink.target = "_blank";
        headerLink.rel = "noopener noreferrer";
      }

      // Set Footer Text
      const providedEl = document.getElementById("providedByText");
      if (providedEl) providedEl.textContent = PORTAL_CONFIG.PROVIDED_BY || "";

      // Sort & Render Action Buttons
      const grid = document.getElementById("actionButtonsGrid");
      const sortedButtons = [...PORTAL_CONFIG.BUTTONS].sort((a, b) => (a.position || 99) - (b.position || 99));
      let firstReviewBtn = null;

      sortedButtons.forEach((btn) => {
        const anchor = document.createElement("a");
        anchor.className = "nav-card";
        anchor.href = btn.link || "#";
        if (btn.link && !btn.link.startsWith("tel:") && !btn.link.startsWith("mailto:")) {
          anchor.target = "_blank";
          anchor.rel = "noopener noreferrer";
        }

        const iconWrap = document.createElement("div");
        iconWrap.className = "icon-wrap";

        if (btn.iconUrl && btn.iconUrl.trim() !== "") {
          iconWrap.innerHTML = `<img src="${btn.iconUrl}" alt="${btn.label}">`;
        } else {
          iconWrap.innerHTML = BUILTIN_ICONS[btn.iconType] || BUILTIN_ICONS.website;
        }

        const labelSpan = document.createElement("span");
        labelSpan.className = "nav-label";
        labelSpan.innerHTML = (btn.label || "").replace(/\n/g, "<br>");

        anchor.appendChild(iconWrap);
        anchor.appendChild(labelSpan);
        grid.appendChild(anchor);

        if (!firstReviewBtn && btn.iconType === "google") {
          firstReviewBtn = anchor;
        }
      });

      const starsRow = document.getElementById("starsRow");
      if (starsRow && firstReviewBtn) {
        starsRow.onclick = () => firstReviewBtn.click();
      }
    })();
  </script>

</body>
</html>
